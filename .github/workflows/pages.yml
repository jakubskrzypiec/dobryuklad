name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'scripts/check-*.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Check JavaScript
        run: |
          for script in dist/*.js dist/wersja-2d/*.js; do node --check "$script"; done
      - name: Check camera motion and interior geometry
        run: |
          node scripts/check-walkthrough-motion.mjs
          node scripts/check-interior-craft.mjs
          node scripts/check-project-story.mjs
          node scripts/check-curtain-transition.mjs
          node scripts/check-home-journey.mjs
          node scripts/check-portfolio-walk.mjs
          node scripts/check-2d-refresh.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
