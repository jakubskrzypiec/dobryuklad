name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'scripts/check-*.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Check JavaScript
        run: |
          for script in dist/*.js dist/wersja-2d/*.js dist/wersja-2d/*.mjs; do node --check "$script"; done
      - name: Check camera motion and interior geometry
        run: |
          node scripts/check-walkthrough-motion.mjs
          node scripts/check-interior-craft.mjs
          node scripts/check-project-story.mjs
          node scripts/check-curtain-transition.mjs
          node scripts/check-home-journey.mjs
          node scripts/check-portfolio-walk.mjs
          node scripts/check-2d-refresh.mjs
          node scripts/check-entrance-walk.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare FFmpeg for video encoding
        timeout-minutes: 5
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            timeout 120s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
            timeout 120s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y ffmpeg
          fi
          ffmpeg -hide_banner -encoders | grep libx264
      - name: Build optimized walkthrough video and smaller Pages artifact
        run: |
          python3 scripts/build-entrance-videos.py --site-root "$RUNNER_TEMP/pages-site"
      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/pages-site
          # A re-run must not produce another artifact called "github-pages".
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          # GitHub Pages caps the deployment timeout at ten minutes.
          timeout: 600000
